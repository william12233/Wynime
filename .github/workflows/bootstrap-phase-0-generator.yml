name: Bootstrap Phase 0 project

on:
  push:
    branches:
      - bootstrap/phase-0
    paths:
      - .phase0-bootstrap-request

permissions:
  contents: write

concurrency:
  group: wynime-phase-0-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Phase 0 branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/phase-0
          fetch-depth: 0

      - name: Generate and validate project
        run: bash tool/bootstrap_phase0.sh

      - name: Commit generated Phase 0 scaffold
        shell: bash
        run: |
          rm -f .phase0-bootstrap-request
          rm -f tool/bootstrap_phase0.sh
          rm -f .github/workflows/bootstrap-phase-0-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: bootstrap Flutter Android and Windows project"
          git push origin HEAD:bootstrap/phase-0
