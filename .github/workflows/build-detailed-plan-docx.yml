name: Build detailed plan DOCX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - docs/PROJECT_PLAN.md
      - docs/ARCHITECTURE.md
      - docs/DECISIONS.md
      - .github/scripts/build_detailed_plan_docx.py
      - .github/workflows/build-detailed-plan-docx.yml

permissions:
  contents: write

concurrency:
  group: wynime-detailed-plan-docx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docx:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install document dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Generate detailed DOCX snapshot
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python .github/scripts/build_detailed_plan_docx.py
      - name: Validate DOCX package
        run: |
          test -s "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"
          unzip -t "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"
      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"
          if git diff --cached --quiet; then
            echo "DOCX is already current."
            exit 0
          fi
          git commit -m "docs: regenerate detailed Wynime plan DOCX"
          git push origin "HEAD:${GITHUB_REF_NAME}"
