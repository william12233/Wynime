name: Format Phase 1 source

on:
  push:
    branches:
      - phase-1/persistence
    paths:
      - .phase1-format-request

permissions:
  contents: write

concurrency:
  group: wynime-phase-1-format
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: phase-1/persistence
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          dart format lib/src/infrastructure/repositories/drift_watch_history_repository.dart
          dart format test/infrastructure/watch_history_repository_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          rm -f .phase1-format-request
          rm -f .github/workflows/format-phase-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Phase 1 watch persistence"
          git pull --rebase origin phase-1/persistence
          git push origin HEAD:phase-1/persistence
