name: Generate Phase 1 persistence artifacts

on:
  push:
    branches:
      - phase-1/persistence
    paths:
      - .phase1-persistence-request

permissions:
  contents: write

concurrency:
  group: wynime-phase-1-persistence-generation
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: phase-1/persistence
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift and plugin artifacts
        run: dart run build_runner build
      - name: Format generated and source files
        run: dart format .
      - name: Commit generated artifacts
        shell: bash
        run: |
          rm -f .phase1-persistence-request
          rm -f .github/workflows/generate-phase-1-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: generate Phase 1 persistence artifacts"
          git pull --rebase origin phase-1/persistence
          git push origin HEAD:phase-1/persistence
