name: Flutter CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  harden-phase-2-decoder:
    name: Add source package size fail-fast
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase-2/source-rules'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v6
        with:
          ref: phase-2/source-rules
          fetch-depth: 0
      - name: Patch decoder when requested
        shell: bash
        run: |
          if [[ ! -f .phase2-decoder-limit-request ]]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/src/infrastructure/source_rules/source_package_decoder.dart')
          text = path.read_text(encoding='utf-8')
          old = """final class SourcePackageDecoder {
            const SourcePackageDecoder();

            SourcePackageManifest decode(String source) {
              final Object? decoded;
          """
          new = """final class SourcePackageDecoder {
            const SourcePackageDecoder();

            static const maxPackageBytes = 256 * 1024;

            SourcePackageManifest decode(String source) {
              final sourceBytes = utf8.encode(source).length;
              if (sourceBytes > maxPackageBytes) {
                throw SourcePackageFormatException(
                  r'$',
                  'Source package exceeds the $maxPackageBytes-byte limit.',
                );
              }

              final Object? decoded;
          """
          if text.count(old) != 1:
              raise SystemExit('Decoder insertion point did not match exactly once.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .phase2-decoder-limit-request
      - name: Format and commit decoder hardening
        shell: bash
        run: |
          dart format lib/src/infrastructure/source_rules/source_package_decoder.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound Phase 2 source package decoding"
          git pull --rebase origin phase-2/source-rules
          git push origin HEAD:phase-2/source-rules

  static-analysis:
    name: Generated code, format, analyze, and document generator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          test -z "$(git status --porcelain)"
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Validate detailed-plan DOCX generator
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python .github/scripts/build_detailed_plan_docx.py
          test -s "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"
          unzip -t "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"

  tests:
    name: Unit, persistence, source-rule, widget, architecture, and golden tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug

  windows-build:
    name: Windows debug build
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows debug application
        run: flutter build windows --debug
