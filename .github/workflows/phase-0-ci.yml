name: Flutter CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  generate-phase-1-schema:
    name: Generate corrected Phase 1 schema mapping
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase-1/persistence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: phase-1/persistence
          fetch-depth: 0
      - name: Check generation request
        id: request
        shell: bash
        run: |
          if [[ -f .phase1-schema-generation-request ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Flutter
        if: steps.request.outputs.required == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        if: steps.request.outputs.required == 'true'
        run: flutter pub get
      - name: Generate Drift mapping
        if: steps.request.outputs.required == 'true'
        run: dart run build_runner build
      - name: Commit generated database mapping
        if: steps.request.outputs.required == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/infrastructure/database/wynime_database.g.dart
          if git diff --cached --quiet; then
            echo "Generated mapping is already current."
            exit 0
          fi
          git commit -m "build: regenerate Phase 1 Drift schema"
          git pull --rebase origin phase-1/persistence
          git push origin HEAD:phase-1/persistence

  static-analysis:
    name: Generated code, format, analyze, and document generator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          test -z "$(git status --porcelain)"
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Validate detailed-plan DOCX generator
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python .github/scripts/build_detailed_plan_docx.py
          test -s "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"
          unzip -t "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"

  tests:
    name: Unit, persistence, widget, architecture, and golden tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug

  windows-build:
    name: Windows debug build
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows debug application
        run: flutter build windows --debug
