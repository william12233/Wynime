name: Flutter CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  phase3-format:
    name: Apply canonical Phase 3 formatting
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-3/webview-capture'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v6
        with:
          ref: phase-3/webview-capture
          fetch-depth: 0
      - name: Check format request
        id: gate
        shell: bash
        run: |
          if [[ -f .phase3-format-request ]]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Flutter
        if: steps.gate.outputs.requested == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply formatter and commit
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          dart format test/architecture/windows_webview_toolchain_test.dart
          rm -f .phase3-format-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/architecture/windows_webview_toolchain_test.dart .phase3-format-request
          git commit -m "style: apply Windows WebView2 toolchain test formatting"
          git pull --rebase origin phase-3/webview-capture
          git push origin HEAD:phase-3/webview-capture

  static-analysis:
    name: Generated code, format, analyze, and document generator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          test -z "$(git status --porcelain)"
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Validate detailed-plan DOCX generator
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python .github/scripts/build_detailed_plan_docx.py
          test -s "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"
          unzip -t "docs/Wynime_完整應用計畫與技術規格_v0.3.docx"

  tests:
    name: Unit, persistence, source-rule, web-capture, widget, architecture, and golden tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug

  windows-build:
    name: Windows debug build
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows debug application
        run: flutter build windows --debug
