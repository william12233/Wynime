name: Apply and validate Phase 4 implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  issues: read

concurrency:
  group: phase4-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.head_ref == 'phase-4/playback-mvp'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase-4/playback-mvp
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Reassemble reviewed source payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          digest = 'aeed412876bfed04ce96274e0c1017419837d2cf0da13b1a657a8c6217ff989d'
          prefix = f'PHASE4_PAYLOAD_{digest}_'
          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              '/issues/9/comments?per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          parts = {}
          for item in comments:
              body = item.get('body') or ''
              marker, separator, payload = body.partition('\n')
              if not separator or not marker.startswith(prefix):
                  continue
              sequence = int(marker.removeprefix(prefix))
              if sequence in parts:
                  raise SystemExit(f'duplicate payload part: {sequence}')
              parts[sequence] = payload.strip()

          expected = list(range(1, 9))
          if sorted(parts) != expected:
              raise SystemExit(
                  f'payload parts mismatch: expected {expected}, got {sorted(parts)}'
              )

          encoded = ''.join(parts[index] for index in expected)
          archive = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != digest:
              raise SystemExit(f'payload digest mismatch: {actual}')

          with open('/tmp/phase4.tar.gz', 'wb') as output:
              output.write(archive)
          PY

          tar -xzf /tmp/phase4.tar.gz
          rm -f .github/workflows/phase4-source-snapshot.yml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format source
        run: dart format .

      - name: Generate Drift mappings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit validated implementation
        shell: bash
        run: |
          test ! -e .github/workflows/phase4-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 1
          fi
          git commit -m 'Phase 4: add secure playback session, proxy, and Media3 MVP'
          git push origin HEAD:phase-4/playback-mvp
