name: Apply and validate Phase 4 implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  issues: read

concurrency:
  group: phase4-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.head_ref == 'phase-4/playback-mvp'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase-4/playback-mvp
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Reassemble reviewed final payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp .github/workflows/phase-0-ci.yml /tmp/phase-0-ci.yml
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          digest = 'd169e5ba9eb6998ee9b9b6bf8c7f5f6ce0d7dcde28621bb6aa5910c031625955'
          prefix = f'PHASE4_FINAL_PAYLOAD_{digest}_'
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              '/issues/9/comments?per_page=100',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          parts = {}
          for item in comments:
              marker, separator, payload = (item.get('body') or '').partition('\n')
              if not separator or not marker.startswith(prefix):
                  continue
              sequence = int(marker.removeprefix(prefix))
              if sequence in parts:
                  raise SystemExit(f'duplicate payload part: {sequence}')
              parts[sequence] = payload.strip()

          expected = [1, 2, 3, 4]
          if sorted(parts) != expected:
              raise SystemExit(
                  f'payload parts mismatch: expected {expected}, got {sorted(parts)}'
              )

          archive = base64.b64decode(
              ''.join(parts[index] for index in expected),
              validate=True,
          )
          actual = hashlib.sha256(archive).hexdigest()
          if actual != digest:
              raise SystemExit(f'payload digest mismatch: {actual}')
          with open('/tmp/phase4-final.tar.gz', 'wb') as output:
              output.write(archive)
          PY

          tar -xzf /tmp/phase4-final.tar.gz
          cp /tmp/phase-0-ci.yml .github/workflows/phase-0-ci.yml
          mv .github/workflows/phase4-source-snapshot.yml /tmp/phase4-source-snapshot.yml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format source
        run: dart format .

      - name: Generate Drift mappings
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Restore one-time workflow
        if: always()
        shell: bash
        run: mv /tmp/phase4-source-snapshot.yml .github/workflows/phase4-source-snapshot.yml

      - name: Commit validated implementation
        shell: bash
        run: |
          test -z "$(git status --porcelain -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Validated implementation already matches the branch.'
            exit 0
          fi
          git commit -m 'Phase 4: add secure playback session, proxy, and Media3 MVP'
          git push origin HEAD:phase-4/playback-mvp
