name: Validate final Phase 5 reviewer files

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: phase5-final-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'phase-5/hls-sanitizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5/hls-sanitizer
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Verify and extract final reviewer files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          names = [
              '01', '02', '03',
              *[f'04{suffix}' for suffix in 'abcdef'],
              *[f'05{suffix}' for suffix in 'abcdef'],
              *[f'06{suffix}' for suffix in 'abcdef'],
              '07', '08', '09a', '09b',
              *[f'09c{index}' for index in range(1, 6)],
              '10',
          ]
          encoded = ''.join(
              Path(f'.phase5-review-payload/{name}.txt').read_text().strip()
              for name in names
          )
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected_digest = 'ba05e67a71be86bc52631ffb53cde576741c30d0558f19813146a27f75088a71'
          if digest != expected_digest:
              raise SystemExit(f'reviewer payload digest mismatch: {digest}')

          expected = {
              'lib/src/domain/models/hls_manifest.dart',
              'lib/src/infrastructure/playback/hls_manifest_parser.dart',
              'lib/src/infrastructure/playback/hls_manifest_fingerprinter.dart',
              'lib/src/infrastructure/playback/loopback_playback_proxy.dart',
              'test/infrastructure/hls_manifest_parser_test.dart',
              'test/infrastructure/hls_manifest_fingerprinter_test.dart',
              'test/infrastructure/loopback_playback_proxy_test.dart',
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              actual = {member.name for member in members}
              if actual != expected:
                  raise SystemExit(
                      'review file path mismatch; '
                      f'missing={sorted(expected - actual)}, '
                      f'extra={sorted(actual - expected)}'
                  )
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe review payload member: {member.name}')
              bundle.extractall(path='.', filter='data')

          test_path = Path(
              'test/infrastructure/loopback_playback_proxy_test.dart'
          )
          content = test_path.read_text()
          broken = "rewrittenMaster.split('\n')"
          fixed = "rewrittenMaster.split('\\n')"
          if content.count(broken) != 1:
              raise SystemExit('proxy newline correction precondition failed')
          test_path.write_text(content.replace(broken, fixed, 1))
          PY

      - name: Format reviewer scope
        run: |
          dart format \
            lib/src/domain/models/hls_manifest.dart \
            lib/src/infrastructure/playback/hls_manifest_parser.dart \
            lib/src/infrastructure/playback/hls_manifest_fingerprinter.dart \
            lib/src/infrastructure/playback/loopback_playback_proxy.dart \
            test/infrastructure/hls_manifest_parser_test.dart \
            test/infrastructure/hls_manifest_fingerprinter_test.dart \
            test/infrastructure/loopback_playback_proxy_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run full tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit validated reviewer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase5-review-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/phase5-final-review.yml'
          if git diff --cached --quiet; then
            echo 'No reviewer changes to commit.'
            exit 1
          fi
          git commit -m 'fix: close Phase 5 manifest safety gaps'
          git push origin HEAD:phase-5/hls-sanitizer
