name: Validate Phase 5 reviewer fixes

on:
  push:
    branches: [phase-5/reviewer-fixes]

permissions:
  contents: write
  issues: read

concurrency:
  group: phase5-review-fixes
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5/reviewer-fixes
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Restore reviewed baseline and apply reviewer patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request

          payload_digest = 'b243d0d568a33a1df32b6821bbdcbe7104634efbed9277b8c2b27040fad45f28'
          patch_digest = 'f54f63aa399a0410e950806fbc6e538e1e3df610fbd6c827fdfdcae61f1392dc'
          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              '/issues/12/comments?per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          payload_prefix = f'PHASE5_PAYLOAD_{payload_digest}_'
          parts = {}
          patch_encoded = None
          patch_marker = f'PHASE5_REVIEW_PATCH_{patch_digest}'
          for item in comments:
              marker, separator, body = (item.get('body') or '').partition('\n')
              if not separator:
                  continue
              if marker.startswith(payload_prefix):
                  suffix = marker.removeprefix(payload_prefix)
                  if not suffix.isdigit():
                      raise SystemExit(f'invalid payload marker: {marker}')
                  sequence = int(suffix)
                  if sequence in parts:
                      raise SystemExit(f'duplicate payload part: {sequence}')
                  parts[sequence] = body.strip()
              elif marker == patch_marker:
                  if patch_encoded is not None:
                      raise SystemExit('duplicate reviewer patch')
                  patch_encoded = body.strip()

          expected = list(range(1, 9))
          if sorted(parts) != expected or patch_encoded is None:
              raise SystemExit('payload or reviewer patch is incomplete')
          archive = base64.b64decode(
              ''.join(parts[index] for index in expected),
              validate=True,
          )
          if hashlib.sha256(archive).hexdigest() != payload_digest:
              raise SystemExit('Phase 5 payload digest mismatch')
          patch_gzip = base64.b64decode(patch_encoded, validate=True)
          if hashlib.sha256(patch_gzip).hexdigest() != patch_digest:
              raise SystemExit('reviewer patch digest mismatch')
          patch = gzip.decompress(patch_gzip)
          if hashlib.sha256(patch).hexdigest() != (
              '728557d589b50cea0f744208c6e00df22eaea544b24cdcab57b9617428d713ba'
          ):
              raise SystemExit('reviewer patch content mismatch')

          target_paths = [
              'lib/src/domain/models/hls_manifest.dart',
              'lib/src/infrastructure/playback/hls_manifest_parser.dart',
              'lib/src/infrastructure/playback/hls_manifest_fingerprinter.dart',
              'lib/src/infrastructure/playback/loopback_playback_proxy.dart',
              'test/infrastructure/hls_manifest_parser_test.dart',
              'test/infrastructure/hls_manifest_fingerprinter_test.dart',
              'test/infrastructure/loopback_playback_proxy_test.dart',
          ]
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = {member.name: member for member in bundle.getmembers()}
              for name in target_paths:
                  member = members.get(name)
                  path = PurePosixPath(name)
                  if (
                      member is None
                      or not member.isfile()
                      or path.is_absolute()
                      or '..' in path.parts
                  ):
                      raise SystemExit(f'unsafe or missing baseline member: {name}')
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read baseline member: {name}')
                  Path(name).write_bytes(source.read())

          path = Path('test/infrastructure/hls_manifest_fingerprinter_test.dart')
          content = path.read_text()
          helper = """

          HlsMediaPlaylist parseMedia(String query, {required String duration}) => parser.parse(
            source: '''
          #EXTM3U
          #EXT-X-VERSION:7
          #EXT-X-TARGETDURATION:10
          #EXT-X-MEDIA-SEQUENCE:1
          #EXT-X-PLAYLIST-TYPE:VOD
          #EXTINF:$duration,
          segment-1.ts?$query
          #EXTINF:6.0,
          segment-2.ts?$query
          #EXT-X-ENDLIST
          ''',
            sourceUri: Uri.parse('https://media.example/show/index.m3u8'),
          ) as HlsMediaPlaylist;
          """
          anchor = "\n  test('ignores volatile authorization values"
          if content.count(anchor) != 1:
              raise SystemExit('fingerprinter baseline anchor missing')
          content = content.replace(anchor, helper + anchor, 1).replace(
              '_parseMedia(',
              'parseMedia(',
          )
          first = content.find(helper)
          second = content.find(helper, first + 1)
          if second == -1:
              raise SystemExit('fingerprinter baseline helper mismatch')
          path.write_text(content[:second] + content[second + len(helper):])

          path = Path('test/infrastructure/loopback_playback_proxy_test.dart')
          content = path.read_text()
          old = "    expect(sanitized, contains('content-100.m4s'));"
          new = "    expect(sanitized, contains('#EXTINF:10,content-a'));"
          if content.count(old) != 1:
              raise SystemExit('proxy baseline expectation mismatch')
          path.write_text(content.replace(old, new, 1))

          Path('/tmp/phase5-review.patch').write_bytes(patch)
          PY

          git apply --check /tmp/phase5-review.patch
          git apply /tmp/phase5-review.patch

      - name: Format reviewer scope
        run: |
          dart format \
            lib/src/domain/models/hls_manifest.dart \
            lib/src/infrastructure/playback/hls_manifest_parser.dart \
            lib/src/infrastructure/playback/hls_manifest_fingerprinter.dart \
            lib/src/infrastructure/playback/loopback_playback_proxy.dart \
            test/infrastructure/hls_manifest_parser_test.dart \
            test/infrastructure/hls_manifest_fingerprinter_test.dart \
            test/infrastructure/loopback_playback_proxy_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run full tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit validated reviewer fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/domain/models/hls_manifest.dart \
            lib/src/infrastructure/playback/hls_manifest_parser.dart \
            lib/src/infrastructure/playback/hls_manifest_fingerprinter.dart \
            lib/src/infrastructure/playback/loopback_playback_proxy.dart \
            test/infrastructure/hls_manifest_parser_test.dart \
            test/infrastructure/hls_manifest_fingerprinter_test.dart \
            test/infrastructure/loopback_playback_proxy_test.dart
          if git diff --cached --quiet; then
            echo 'No reviewer changes to commit.'
            exit 1
          fi
          git commit -m 'fix: close Phase 5 manifest safety gaps'
          git push origin HEAD:phase-5/reviewer-fixes
