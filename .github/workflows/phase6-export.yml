name: Phase 6 Source Export

on:
  push:
    branches:
      - phase-6/staging
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 5 main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wynime-phase5-main-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
