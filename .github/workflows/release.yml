name: Release
'on':
  push:
    tags:
    - v*
permissions:
  actions: write
  contents: write
jobs:
  consistency-check:
    name: Validate Android and Windows workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: python -m pip install PyYAML
    - run: python .github/workflows/validate_platform_workflows.py
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      uploadUrl: ${{ steps.step-5.outputs.upload_url }}
      id: ${{ steps.step-5.outputs.id }}
    steps:
    - id: step-0
      uses: actions/checkout@v4
    - id: step-1
      name: Get Tag
      uses: dawidd6/action-get-tag@v1
    - id: step-2
      uses: bhowell2/github-substring-action@v1.0.0
      with:
        value: ${{ steps.step-1.outputs.tag }}
        index_of_str: v
        default_return_value: ${{ steps.step-1.outputs.tag }}
    - id: step-3
      name: Generate Release Notes
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GIT_TAG: ${{ steps.step-1.outputs.tag }}
        TAG_VERSION: ${{ steps.step-2.outputs.substring }}
      run: |
        set -euo pipefail

        export RELEASE_NOTES="Wynime ${{ steps.step-2.outputs.substring }} release."

        python3 - <<'PY' > "$RUNNER_TEMP/release-body.md"
        import os
        from pathlib import Path

        body = Path("ci-helper/release-template.md").read_text()
        replacements = {
            "$RELEASE_NOTES": os.environ["RELEASE_NOTES"],
            "$GIT_TAG": os.environ["GIT_TAG"],
            "$TAG_VERSION": os.environ["TAG_VERSION"],
        }
        for key, value in replacements.items():
            body = body.replace(key, value)
        print(body, end="")
        PY

        echo "body_path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
    - id: step-4
      name: Validate formal release signing configuration
      env:
        SIGNING_RELEASE_STOREFILE: ${{ secrets.SIGNING_RELEASE_STOREFILE || secrets.ANDROID_KEYSTORE_BASE64 }}
        SIGNING_RELEASE_STOREPASSWORD: ${{ secrets.SIGNING_RELEASE_STOREPASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        SIGNING_RELEASE_KEYALIAS: ${{ secrets.SIGNING_RELEASE_KEYALIAS || secrets.ANDROID_KEY_ALIAS }}
        SIGNING_RELEASE_KEYPASSWORD: ${{ secrets.SIGNING_RELEASE_KEYPASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      run: "set -euo pipefail\nfor variable in \\\n  SIGNING_RELEASE_STOREFILE \\\n  SIGNING_RELEASE_STOREPASSWORD \\\n  SIGNING_RELEASE_KEYALIAS\
        \ \\\n  SIGNING_RELEASE_KEYPASSWORD; do\n  if [ -z \"${!variable:-}\" ]; then\n    echo \"$variable is required for\
        \ an official release\" >&2\n    exit 1\n  fi\ndone"
    - id: step-5
      name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: ${{ steps.step-3.outputs.body_path }}
        name: ${{ steps.step-2.outputs.substring }}
        tag_name: ${{ steps.step-1.outputs.tag }}
        draft: 'false'
        prerelease: ${{ contains(steps.step-1.outputs.tag, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release_github-windows-2022:
    name: Windows Server 2019 x86_64
    runs-on:
    - windows-2022
    needs:
    - create-release
    steps:
    - id: step-0
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - id: step-1
      name: Get Tag
      uses: dawidd6/action-get-tag@v1
    - id: step-2
      uses: bhowell2/github-substring-action@v1.0.0
      with:
        value: ${{ steps.step-1.outputs.tag }}
        index_of_str: v
        default_return_value: ${{ steps.step-1.outputs.tag }}
    - id: step-3
      continue-on-error: true
      run: rm local.properties
    - id: step-4
      continue-on-error: true
      run: 'echo "wynime.android.abis=x86_64" >> local.properties

        echo "wynime.sentry.dsn=${{ secrets.SENTRY_DSN }}" >> local.properties

        echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties

        '
    - id: step-5
      continue-on-error: true
      run: "if ($env:FIREBASE_GA_APP_ID -and $env:FIREBASE_GA_API_SECRET) {\n  Add-Content -LiteralPath local.properties -Value\
        \ \"wynime.enable.firebase=true\"\n  Add-Content -LiteralPath local.properties -Value \"firebase.ga.app.id=$env:FIREBASE_GA_APP_ID\"\
        \n  Add-Content -LiteralPath local.properties -Value \"firebase.ga.api.secret=$env:FIREBASE_GA_API_SECRET\"\n}\n"
      if: ${{ (github.repository == 'william12233/Wynime') && (!(github.event_name == 'pull_request')) }}
      env:
        FIREBASE_GA_APP_ID: ${{ secrets.FIREBASE_GA_APP_ID }}
        FIREBASE_GA_API_SECRET: ${{ secrets.FIREBASE_GA_API_SECRET }}
    - id: step-6
      name: Get JBR (Windows)
      env:
        RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        JBR_URL: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-windows-x64-b1163.116.tar.gz
        JBR_CHECKSUM_URL: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-windows-x64-b1163.116.tar.gz.checksum
      shell: cmd
      run: python .github/workflows/download_jbr.py
    - id: step-7
      name: Setup JBR 21 for Windows
      uses: gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d
      with:
        java-version: '21'
        distribution: jdkfile
        jdkFile: ${{ steps.step-6.outputs.jbrLocation }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - id: step-8
      name: Dump Local Properties
      run: echo "jvm.toolchain.version=21" >> local.properties
    - id: step-9
      name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: 'true'
    - id: step-10
      name: 'Clean and download dependencies (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew --scan "--stacktrace" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g
        -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g" "--parallel"
    - id: step-11
      name: 'Clean and download dependencies (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew --scan "--stacktrace" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g
        -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g" "--parallel"
      if: ${{ steps.step-10.outcome == 'failure' }}
    - id: step-12
      name: 'Update Release Version Name (Attempt #1)'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
        CI_RELEASE_ID: ${{ needs.create-release.outputs.id }}
        CI_TAG: ${{ steps.step-1.outputs.tag }}
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew updateReleaseVersionNameFromGit "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"
        "--parallel"
    - id: step-13
      name: 'Update Release Version Name (Attempt #2)'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
        CI_RELEASE_ID: ${{ needs.create-release.outputs.id }}
        CI_TAG: ${{ steps.step-1.outputs.tag }}
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew updateReleaseVersionNameFromGit "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"
        "--parallel"
      if: ${{ steps.step-12.outcome == 'failure' }}
    - id: step-14
      name: Prepare google-services.json
      env:
        BASE64_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        FILE_PATH: ./app/android/google-services.json
      continue-on-error: true
      shell: bash
      run: "set -euo pipefail\n\nif [ -z \"${BASE64_CONTENT:-}\" ]; then\n  echo \"BASE64_CONTENT is empty\" >&2\n  exit 1\n\
        fi\n\nmkdir -p \"$(dirname \"$FILE_PATH\")\"\nif ! printf '%s' \"$BASE64_CONTENT\" | base64 --decode > \"$FILE_PATH\"\
        \ 2>/dev/null; then\n  printf '%s' \"$BASE64_CONTENT\" | base64 -D > \"$FILE_PATH\"\nfi\nchmod 600 \"$FILE_PATH\"\n\
        echo \"filePath=$FILE_PATH\" >> \"$GITHUB_OUTPUT\""
      if: ${{ (github.repository == 'william12233/Wynime') && (!(github.event_name == 'pull_request')) }}
    - id: step-15
      name: 'Compile Kotlin (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew compileKotlin compileCommonMainKotlinMetadata compileJvmMainKotlinMetadata compileKotlinDesktop compileKotlinMetadata
        "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g"
        "-Dkotlin.daemon.jvm.options=-Xmx4g" "--parallel" "--no-configuration-cache"
    - id: step-16
      name: 'Compile Kotlin (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew compileKotlin compileCommonMainKotlinMetadata compileJvmMainKotlinMetadata compileKotlinDesktop compileKotlinMetadata
        "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g"
        "-Dkotlin.daemon.jvm.options=-Xmx4g" "--parallel" "--no-configuration-cache"
      if: ${{ steps.step-15.outcome == 'failure' }}
    - id: step-17
      name: 'Compile Kotlin Android (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew compileDefaultDebugKotlin compileDefaultReleaseKotlin "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"
        "--parallel" "--no-configuration-cache"
    - id: step-18
      name: 'Compile Kotlin Android (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew compileDefaultDebugKotlin compileDefaultReleaseKotlin "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"
        "--parallel" "--no-configuration-cache"
      if: ${{ steps.step-17.outcome == 'failure' }}
    - id: step-19
      name: 'Upload Desktop Installers (Attempt #1)'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
        CI_RELEASE_ID: ${{ needs.create-release.outputs.id }}
        CI_TAG: ${{ steps.step-1.outputs.tag }}
        UPLOAD_TO_S3: 'false'
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_BASEURL: ${{ secrets.AWS_BASEURL }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        APPLE_DISTRIBUTION_PRIVATE_KEY_PFX: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_PFX }}
        APPLE_DISTRIBUTION_PRIVATE_KEY_PFX_IMPORT_PWD: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_PFX_IMPORT_PWD }}
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew :ci-helper:uploadDesktopInstallers "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"
        "--parallel"
    - id: step-20
      name: 'Upload Desktop Installers (Attempt #2)'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
        CI_RELEASE_ID: ${{ needs.create-release.outputs.id }}
        CI_TAG: ${{ steps.step-1.outputs.tag }}
        UPLOAD_TO_S3: 'false'
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_BASEURL: ${{ secrets.AWS_BASEURL }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        APPLE_DISTRIBUTION_PRIVATE_KEY_PFX: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_PFX }}
        APPLE_DISTRIBUTION_PRIVATE_KEY_PFX_IMPORT_PWD: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_PFX_IMPORT_PWD }}
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew :ci-helper:uploadDesktopInstallers "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g"
        "--parallel"
      if: ${{ steps.step-19.outcome == 'failure' }}
    - id: step-21
      name: Upload compose logs
      uses: actions/upload-artifact@v4
      with:
        name: compose-logs-github-windows-2022
        path: app/desktop/build/compose/logs
      if: ${{ always() }}
  release_github-ubuntu-2404:
    name: Ubuntu 24.04 Android arm64-v8a
    runs-on:
    - ubuntu-24.04
    needs:
    - create-release
    steps:
    - id: step-0
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - id: step-1
      name: Get Tag
      uses: dawidd6/action-get-tag@v1
    - id: step-2
      uses: bhowell2/github-substring-action@v1.0.0
      with:
        value: ${{ steps.step-1.outputs.tag }}
        index_of_str: v
        default_return_value: ${{ steps.step-1.outputs.tag }}
    - id: step-3
      name: Free space for Ubuntu
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        android: 'false'
        large-packages: 'false'
        tool-cache: 'false'
    - id: step-4
      name: Enable Swap
      run: 'sudo fallocate -l 10G /swapfile

        sudo chmod 600 /swapfile

        sudo mkswap /swapfile

        sudo swapon /swapfile'
    - id: step-5
      continue-on-error: true
      run: rm local.properties
    - id: step-6
      continue-on-error: true
      run: 'echo "wynime.android.abis=arm64-v8a" >> local.properties

        echo "wynime.sentry.dsn=${{ secrets.SENTRY_DSN }}" >> local.properties

        '
    - id: step-7
      continue-on-error: true
      run: "if [ -n \"$FIREBASE_GA_APP_ID\" ] && [ -n \"$FIREBASE_GA_API_SECRET\" ]; then\n  printf '%s\\n' 'wynime.enable.firebase=true'\
        \ >> local.properties\n  printf '%s\\n' \"firebase.ga.app.id=$FIREBASE_GA_APP_ID\" >> local.properties\n  printf '%s\\\
        n' \"firebase.ga.api.secret=$FIREBASE_GA_API_SECRET\" >> local.properties\nfi\n"
      if: ${{ (github.repository == 'william12233/Wynime') && (!(github.event_name == 'pull_request')) }}
      env:
        FIREBASE_GA_APP_ID: ${{ secrets.FIREBASE_GA_APP_ID }}
        FIREBASE_GA_API_SECRET: ${{ secrets.FIREBASE_GA_API_SECRET }}
    - id: step-8
      name: Get JBR (Windows)
      env:
        RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        JBR_URL: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz
        JBR_CHECKSUM_URL: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz.checksum
      shell: bash
      run: python .github/workflows/download_jbr.py
    - id: step-9
      name: Setup JBR 21 for Ubuntu
      uses: gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d
      with:
        java-version: '21'
        distribution: jdkfile
        jdkFile: ${{ steps.step-8.outputs.jbrLocation }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - id: step-10
      name: Dump Local Properties
      run: echo "jvm.toolchain.version=21" >> local.properties
    - id: step-11
      run: chmod -R 777 .
    - id: step-12
      name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: 'true'
    - id: step-13
      name: 'Clean and download dependencies (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew --scan "--stacktrace" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g
        -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
    - id: step-14
      name: 'Clean and download dependencies (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew --scan "--stacktrace" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g
        -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
      if: ${{ steps.step-13.outcome == 'failure' }}
    - id: step-15
      name: 'Update Release Version Name (Attempt #1)'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
        CI_RELEASE_ID: ${{ needs.create-release.outputs.id }}
        CI_TAG: ${{ steps.step-1.outputs.tag }}
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew updateReleaseVersionNameFromGit "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
    - id: step-16
      name: 'Update Release Version Name (Attempt #2)'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
        CI_RELEASE_ID: ${{ needs.create-release.outputs.id }}
        CI_TAG: ${{ steps.step-1.outputs.tag }}
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew updateReleaseVersionNameFromGit "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
      if: ${{ steps.step-15.outcome == 'failure' }}
    - id: step-17
      name: Prepare signing key
      env:
        BASE64_CONTENT: ${{ secrets.SIGNING_RELEASE_STOREFILE || secrets.ANDROID_KEYSTORE_BASE64 }}
        FILE_PATH: ./android_signing_key
      continue-on-error: false
      shell: bash
      run: "set -euo pipefail\n\nif [ -z \"${BASE64_CONTENT:-}\" ]; then\n  echo \"BASE64_CONTENT is empty\" >&2\n  exit 1\n\
        fi\n\nmkdir -p \"$(dirname \"$FILE_PATH\")\"\nif ! printf '%s' \"$BASE64_CONTENT\" | base64 --decode > \"$FILE_PATH\"\
        \ 2>/dev/null; then\n  printf '%s' \"$BASE64_CONTENT\" | base64 -D > \"$FILE_PATH\"\nfi\nchmod 600 \"$FILE_PATH\"\n\
        echo \"filePath=$FILE_PATH\" >> \"$GITHUB_OUTPUT\""
      if: ${{ (github.repository == 'william12233/Wynime') && (!(github.event_name == 'pull_request')) }}
    - id: step-18
      name: Prepare google-services.json
      env:
        BASE64_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        FILE_PATH: ./app/android/google-services.json
      continue-on-error: true
      shell: bash
      run: "set -euo pipefail\n\nif [ -z \"${BASE64_CONTENT:-}\" ]; then\n  echo \"BASE64_CONTENT is empty\" >&2\n  exit 1\n\
        fi\n\nmkdir -p \"$(dirname \"$FILE_PATH\")\"\nif ! printf '%s' \"$BASE64_CONTENT\" | base64 --decode > \"$FILE_PATH\"\
        \ 2>/dev/null; then\n  printf '%s' \"$BASE64_CONTENT\" | base64 -D > \"$FILE_PATH\"\nfi\nchmod 600 \"$FILE_PATH\"\n\
        echo \"filePath=$FILE_PATH\" >> \"$GITHUB_OUTPUT\""
      if: ${{ (github.repository == 'william12233/Wynime') && (!(github.event_name == 'pull_request')) }}
    - id: step-19
      name: 'Compile Kotlin (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew :app:android:compileDefaultDebugKotlin :app:android:compileDefaultReleaseKotlin "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
    - id: step-20
      name: 'Compile Kotlin (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew :app:android:compileDefaultDebugKotlin :app:android:compileDefaultReleaseKotlin "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
      if: ${{ steps.step-19.outcome == 'failure' }}
    - id: step-21
      name: 'Compile Kotlin Android (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: ./gradlew compileDefaultDebugKotlin compileDefaultReleaseKotlin "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
    - id: step-22
