      continue-on-error: false
      timeout-minutes: 180
      run: ./gradlew :ci-helper:uploadAndroidApk "--no-configuration-cache" "--scan" "-Porg.gradle.daemon.idletimeout=60000"
        "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"
      if: ${{ steps.step-28.outcome == 'failure' }}
  verify-release-assets:
    name: Verify official release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
    - create-release
    - release_github-windows-2022
    - release_github-ubuntu-2404
    steps:
    - id: step-0
      uses: actions/checkout@v4
    - id: step-1
      name: Setup Android SDK for release verification
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: 'true'
        packages: platform-tools platforms;android-37.0 build-tools;36.0.0
    - id: step-2
      name: Get Tag
      uses: dawidd6/action-get-tag@v1
    - id: step-3
      uses: bhowell2/github-substring-action@v1.0.0
      with:
        value: ${{ steps.step-2.outputs.tag }}
        index_of_str: v
        default_return_value: ${{ steps.step-2.outputs.tag }}
    - id: step-4
      name: Verify release names, APK signature, ABI, and ZIP
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RELEASE_ID: ${{ needs.create-release.outputs.id }}
        TAG_VERSION: ${{ steps.step-3.outputs.substring }}
      run: "set -euo pipefail\n\nexpectedAndroid=\"wynime-$TAG_VERSION-arm64-v8a.apk\"\nexpectedWindows=\"wynime-$TAG_VERSION-windows-x86_64.zip\"\
        \nassetsUrl=\"repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100\"\nassetsJson=\"$(gh api \"$assetsUrl\"\
        )\"\nactualNames=\"$(printf '%s' \"$assetsJson\" | jq -r '.[].name' | sort)\"\nexpectedNames=\"$(printf '%s\\n%s\\\
        n' \"$expectedAndroid\" \"$expectedWindows\" | sort)\"\nassetCount=\"$(printf '%s\\n' \"$actualNames\" | sed '/^$/d'\
        \ | wc -l | tr -d ' ')\"\n\nif [ \"$assetCount\" -ne 2 ] || [ \"$actualNames\" != \"$expectedNames\" ]; then\n  echo\
        \ \"Official release must contain exactly these two assets:\" >&2\n  printf '%s\\n' \"$expectedNames\" >&2\n  echo\
        \ \"Actual assets:\" >&2\n  printf '%s\\n' \"$actualNames\" >&2\n  exit 1\nfi\n\nandroidId=\"$(printf '%s' \"$assetsJson\"\
        \ | jq -r --arg name \"$expectedAndroid\" '.[] | select(.name == $name) | .id')\"\nwindowsId=\"$(printf '%s' \"$assetsJson\"\
        \ | jq -r --arg name \"$expectedWindows\" '.[] | select(.name == $name) | .id')\"\ntest -n \"$androidId\"\ntest -n\
        \ \"$windowsId\"\n\nsdkRoot=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}\"\ntest -n \"$sdkRoot\"\napksigner=\"$(find \"\
        $sdkRoot/build-tools\" -type f -name apksigner -print | sort -V | tail -n 1)\"\naapt2=\"$(find \"$sdkRoot/build-tools\"\
        \ -type f -name aapt2 -print | sort -V | tail -n 1)\"\ntest -n \"$apksigner\"\ntest -n \"$aapt2\"\n\napkPath=\"$RUNNER_TEMP/$expectedAndroid\"\
        \nzipPath=\"$RUNNER_TEMP/$expectedWindows\"\ngh api -H 'Accept: application/octet-stream' \"repos/$GITHUB_REPOSITORY/releases/assets/$androidId\"\
        \ --output \"$apkPath\"\ngh api -H 'Accept: application/octet-stream' \"repos/$GITHUB_REPOSITORY/releases/assets/$windowsId\"\
        \ --output \"$zipPath\"\n\n\"$apksigner\" verify --verbose \"$apkPath\"\nnativeCode=\"$(\"$aapt2\" dump badging \"\
        $apkPath\" | sed -n 's/^native-code: //p')\"\nprintf '%s\\n' \"$nativeCode\" | grep -Fxq \"'arm64-v8a'\"\nif printf\
        \ '%s\\n' \"$nativeCode\" | grep -Eq \"'(x86_64|armeabi-v7a|x86)'\"; then\n  echo \"The official APK contains an unexpected\
        \ ABI: $nativeCode\" >&2\n  exit 1\nfi\nunzip -t \"$zipPath\" >/dev/null"
