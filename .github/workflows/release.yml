name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: wynime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'
  WYNIME_BANGUMI_BROKER_ORIGIN: ${{ vars.WYNIME_BANGUMI_BROKER_ORIGIN }}

jobs:
  metadata:
    name: Validate release metadata and readiness
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      candidate_sha: ${{ steps.version.outputs.candidate_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate tag, version, notes and hard release gates
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z; received: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          version_line="$(grep -m1 -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+[[:space:]]*$' pubspec.yaml || true)"
          app_version="$(printf '%s' "$version_line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+[[:space:]]*$/\1/')"
          version_code="$(printf '%s' "$version_line" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/')"
          if [[ -z "$app_version" || "$app_version" != "$version" ]]; then
            echo "Tag $tag does not match pubspec.yaml base version $app_version" >&2
            exit 1
          fi
          if [[ -z "$version_code" || "$version_code" -le 0 ]]; then
            echo "pubspec.yaml must contain a positive Android versionCode." >&2
            exit 1
          fi

          git fetch origin main --no-tags
          tagged_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          trigger_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          origin_main_sha="$(git rev-parse "origin/main^{commit}")"
          if [[ "$tagged_sha" != "$trigger_sha" ]]; then
            echo "Tag target $tagged_sha does not equal the push trigger SHA $trigger_sha." >&2
            exit 1
          fi
          if [[ "$tagged_sha" != "$origin_main_sha" ]]; then
            echo "Tag target $tagged_sha is not the current origin/main $origin_main_sha." >&2
            exit 1
          fi

          ci_runs="$(GH_TOKEN="$GH_TOKEN" gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow phase-0-ci.yml \
            --commit "$tagged_sha" \
            --limit 20 \
            --json headSha,status,conclusion)"
          if ! jq -e --arg sha "$tagged_sha" \
            '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length > 0' \
            <<< "$ci_runs" >/dev/null; then
            echo "No successful phase-0 CI run exists for immutable candidate SHA $tagged_sha." >&2
            exit 1
          fi

          notes_file="docs/release-notes-$version.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "Missing versioned release notes: $notes_file" >&2
            exit 1
          fi
          grep -F "Windows x64 ZIP" "$notes_file" >/dev/null
          grep -F "HARDWARE_VALIDATION_PENDING" "$notes_file" >/dev/null
          grep -F "WINDOWS_CUA_VALIDATION_UNAVAILABLE" "$notes_file" >/dev/null

          release_status="$(sed -n 's/^`\([^`]*\)`[[:space:]]*$/\1/p' docs/PHASE12_STATUS.md | head -n 1)"
          if [[ "$release_status" != 'RELEASE_READY' ]]; then
            echo "Phase 12 release gate is $release_status, not RELEASE_READY." >&2
            exit 1
          fi

          provenance_status="$(sed -n 's/^Status:[[:space:]]*`\([^`]*\)`[[:space:]]*$/\1/p' docs/THIRD_PARTY_PROVENANCE.md | head -n 1)"
          if [[ "$provenance_status" != 'CLOSED_RELEASE_PROVENANCE' ]]; then
            echo "Engineering native provenance gate is $provenance_status, not CLOSED_RELEASE_PROVENANCE." >&2
            exit 1
          fi

          if [[ ! -s LICENSE ]]; then
            echo "Missing approved Wynime distribution license: LICENSE" >&2
            exit 1
          fi
          if ! grep -F "Approved Wynime distribution license: yes" docs/PHASE12_STATUS.md >/dev/null; then
            echo "Approved Wynime distribution license marker is missing." >&2
            exit 1
          fi

          test -s "assets/third_party/THIRD_PARTY_NOTICES.md"
          grep -F "Candidate-specific evidence" "assets/third_party/THIRD_PARTY_NOTICES.md" >/dev/null
          test -s "assets/third_party/COPYING.LGPLv3"
          grep -F "GNU LESSER GENERAL PUBLIC LICENSE" "assets/third_party/COPYING.LGPLv3" >/dev/null
          grep -F "Version 3, 29 June 2007" "assets/third_party/COPYING.LGPLv3" >/dev/null
          [[ "$(sha256sum assets/third_party/COPYING.LGPLv3 | cut -d' ' -f1)" == "da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768" ]]
          test -s "assets/third_party/COPYING.GPLv3"
          grep -F "GNU GENERAL PUBLIC LICENSE" "assets/third_party/COPYING.GPLv3" >/dev/null
          grep -F "Version 3, 29 June 2007" "assets/third_party/COPYING.GPLv3" >/dev/null
          [[ "$(sha256sum assets/third_party/COPYING.GPLv3 | cut -d' ' -f1)" == "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903" ]]
          test -s "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md"
          grep -F "For three years" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "relink" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "FFmpeg" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "https://github.com/FFmpeg/FFmpeg/tree/n6.0" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "media-kit/libmpv-android-video-build/releases/tag/v1.1.7" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "buildscripts/flavors/default.sh" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "5968d5d2dc84dd4726540b846acbd26caa1984c3" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "481757452663bdac8162dea49e1699176411c5c7" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "media-kit/libmpv-win32-video-cmake/releases/tag/20241021" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "8ddbe5472465950b87853789f7173f2eedc5586a" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "8d940a07d19023a98689f353e4425a14688547e9" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "ffbcbfc34882110acf2c271bdae994570bd62c39" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "Android LGPLv3" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "Windows LGPLv3" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "Combined Work GPLv3 license" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "94a9ed024d3859793618152ea559a168bbcbb5e2" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "https://raw.githubusercontent.com/FFmpeg/FFmpeg/ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2/COPYING.GPLv3" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "https://raw.githubusercontent.com/FFmpeg/FFmpeg/8d940a07d19023a98689f353e4425a14688547e9/COPYING.GPLv3" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "COPYING.LGPLv3" "assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          grep -F "e9abf3b9114fdb565b13a4c194d776c70e416e7d" pubspec.lock >/dev/null
          test -s assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json
          jq -e '
             .schemaVersion == 1
             and .package.name == "media_kit_libs_windows_video"
             and .package.version == "1.0.12"
             and .package.commit == "e9abf3b9114fdb565b13a4c194d776c70e416e7d"
             and .androidBuild.releaseTag == "v1.1.7"
             and .androidBuild.releaseTagCommit == "fe8c3ac1a91c09aa6fb1deccbc833f1bafa54768"
             and .androidBuild.flavor == "default"
             and .androidBuild.mpvCommit == "78d43740f52db817d98bcf24fb30a76ab6fa13ff"
             and .androidBuild.ffmpeg.version == "6.0"
             and .androidBuild.ffmpeg.sourceTag == "n6.0"
             and .androidBuild.ffmpeg.sourceTagCommit == "3949db4d261748a9f34358a388ee255ad1a7f0c0"
             and .androidBuild.ffmpeg.sourceCommit == "ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2"
             and .androidBuild.ffmpeg.configurePolicy.required == ["--disable-gpl", "--disable-nonfree", "--enable-version3", "--enable-static", "--disable-shared", "--enable-mbedtls"]
             and .androidBuild.ffmpeg.configurePolicy.forbidden == ["--enable-gpl", "--enable-nonfree"]
             and .androidBuild.ffmpeg.configurePolicy.script == "buildscripts/flavors/default.sh"
             and .androidBuild.ffmpeg.configurePolicy.scriptBlob == "5968d5d2dc84dd4726540b846acbd26caa1984c3"
             and .androidBuild.ffmpeg.configurePolicy.scriptSha256 == "d5b84c3398fc673c6210f6b0559a163d5c1e1c146b1dc52eab211c3ad0ba09ce"
             and .androidBuild.scripts.defaultFfmpeg.blob == "5968d5d2dc84dd4726540b846acbd26caa1984c3"
             and .androidBuild.scripts.defaultFfmpeg.sha256 == "d5b84c3398fc673c6210f6b0559a163d5c1e1c146b1dc52eab211c3ad0ba09ce"
             and .androidBuild.scripts.dependencyRecord.blob == "481757452663bdac8162dea49e1699176411c5c7"
             and .androidBuild.scripts.dependencyRecord.sha256 == "3ac50b68e1669694f3e0b77d45a66bdae27a7bb23600389f6cfb686b924483b3"
             and .nativeArchive.releaseTag == "20241021"
            and .nativeArchive.releaseTagCommit == "8ddbe5472465950b87853789f7173f2eedc5586a"
            and .nativeArchive.sha256 == "e23701df0adc1fe57c8ede3ff313513b0b80519870058c2d35ff02754284a007"
            and .build.mpvCommit == "0f7858451817c5fd5ebdb74a807a7c997662c390"
            and .build.ffmpegCommit == "8d940a07d19023a98689f353e4425a14688547e9"
            and .build.ffmpegConfigurePolicy.required == ["--disable-gpl", "--disable-nonfree", "--enable-version3", "--enable-static", "--disable-shared"]
            and .build.ffmpegConfigurePolicy.forbidden == ["--enable-gpl", "--enable-nonfree"]
             and .licenses.androidFfmpeg.spdx == "LGPL-3.0-or-later"
             and .licenses.androidFfmpeg.file == "assets/third_party/COPYING.LGPLv3"
             and .licenses.androidFfmpeg.sha256 == "da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768"
             and .licenses.androidFfmpeg.sourceTag == "n6.0"
             and .licenses.androidFfmpeg.sourceTagCommit == "3949db4d261748a9f34358a388ee255ad1a7f0c0"
             and .licenses.androidFfmpeg.sourceCommit == "ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2"
             and .licenses.combinedWorkGpl.spdx == "GPL-3.0-or-later"
             and .licenses.combinedWorkGpl.file == "assets/third_party/COPYING.GPLv3"
             and .licenses.combinedWorkGpl.sha256 == "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903"
             and .licenses.combinedWorkGpl.sourceBlob == "94a9ed024d3859793618152ea559a168bbcbb5e2"
             and .licenses.combinedWorkGpl.sourceRefs == [
               {"sourceCommit": "ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2", "sourceUrl": "https://raw.githubusercontent.com/FFmpeg/FFmpeg/ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2/COPYING.GPLv3"},
               {"sourceCommit": "8d940a07d19023a98689f353e4425a14688547e9", "sourceUrl": "https://raw.githubusercontent.com/FFmpeg/FFmpeg/8d940a07d19023a98689f353e4425a14688547e9/COPYING.GPLv3"}
             ]
            and .licenses.windowsFfmpeg.spdx == "LGPL-3.0-or-later"
            and .licenses.windowsFfmpeg.file == "assets/third_party/COPYING.LGPLv3"
            and .licenses.windowsFfmpeg.sha256 == "da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768"
            and .licenses.windowsFfmpeg.sourceCommit == "8d940a07d19023a98689f353e4425a14688547e9"
          ' assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json >/dev/null
          android_ffmpeg_script="$(mktemp)"
          android_depinfo="$(mktemp)"
          android_lgplv3_source="$(mktemp)"
          android_gplv3_source="$(mktemp)"
          ffmpeg_source="$(mktemp)"
          lgplv3_source="$(mktemp)"
          windows_gplv3_source="$(mktemp)"
          trap 'rm -f "$android_ffmpeg_script" "$android_depinfo" "$android_lgplv3_source" "$android_gplv3_source" "$ffmpeg_source" "$lgplv3_source" "$windows_gplv3_source"' EXIT
          curl --fail --location --retry 3 --silent --show-error \
            -o "$android_ffmpeg_script" \
            "https://raw.githubusercontent.com/media-kit/libmpv-android-video-build/v1.1.7/buildscripts/flavors/default.sh"
          [[ "$(git hash-object "$android_ffmpeg_script")" == "5968d5d2dc84dd4726540b846acbd26caa1984c3" ]]
          [[ "$(sha256sum "$android_ffmpeg_script" | cut -d' ' -f1)" == "d5b84c3398fc673c6210f6b0559a163d5c1e1c146b1dc52eab211c3ad0ba09ce" ]]
          for required_flag in --disable-gpl --disable-nonfree --enable-version3 --enable-static --disable-shared --enable-mbedtls; do
            grep -F -- "$required_flag" "$android_ffmpeg_script" >/dev/null
          done
          if grep -F -- "--enable-gpl" "$android_ffmpeg_script" >/dev/null || grep -F -- "--enable-nonfree" "$android_ffmpeg_script" >/dev/null; then
            echo 'The pinned Android FFmpeg default script contains a forbidden enable flag.' >&2
            exit 1
          fi
          curl --fail --location --retry 3 --silent --show-error \
            -o "$android_depinfo" \
            "https://raw.githubusercontent.com/media-kit/libmpv-android-video-build/v1.1.7/buildscripts/include/depinfo.sh"
          [[ "$(git hash-object "$android_depinfo")" == "481757452663bdac8162dea49e1699176411c5c7" ]]
          [[ "$(sha256sum "$android_depinfo" | cut -d' ' -f1)" == "3ac50b68e1669694f3e0b77d45a66bdae27a7bb23600389f6cfb686b924483b3" ]]
          curl --fail --location --retry 3 --silent --show-error \
            -o "$android_lgplv3_source" \
            "$(jq -r '.licenses.androidFfmpeg.sourceUrl' assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json)"
          [[ "$(sha256sum "$android_lgplv3_source" | cut -d' ' -f1)" == "da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768" ]]
          cmp --silent assets/third_party/COPYING.LGPLv3 "$android_lgplv3_source"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$android_gplv3_source" \
            "$(jq -r '.licenses.combinedWorkGpl.sourceRefs[0].sourceUrl' assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json)"
          [[ "$(git hash-object "$android_gplv3_source")" == "94a9ed024d3859793618152ea559a168bbcbb5e2" ]]
          [[ "$(sha256sum "$android_gplv3_source" | cut -d' ' -f1)" == "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903" ]]
          cmp --silent assets/third_party/COPYING.GPLv3 "$android_gplv3_source"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$ffmpeg_source" \
            "https://raw.githubusercontent.com/media-kit/libmpv-win32-video-cmake/8ddbe5472465950b87853789f7173f2eedc5586a/packages/ffmpeg.cmake"
          [[ "$(git hash-object "$ffmpeg_source")" == "ffbcbfc34882110acf2c271bdae994570bd62c39" ]]
          grep -F -- "--disable-gpl" "$ffmpeg_source" >/dev/null
          grep -F -- "--disable-nonfree" "$ffmpeg_source" >/dev/null
          if grep -F -- "--enable-gpl" "$ffmpeg_source" >/dev/null || grep -F -- "--enable-nonfree" "$ffmpeg_source" >/dev/null; then
            echo 'The pinned Windows FFmpeg build script contains a forbidden enable flag.' >&2
            exit 1
          fi
          curl --fail --location --retry 3 --silent --show-error \
            -o "$lgplv3_source" \
            "$(jq -r '.licenses.windowsFfmpeg.sourceUrl' assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json)"
          [[ "$(sha256sum "$lgplv3_source" | cut -d' ' -f1)" == "da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768" ]]
          cmp --silent assets/third_party/COPYING.LGPLv3 "$lgplv3_source"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$windows_gplv3_source" \
            "$(jq -r '.licenses.combinedWorkGpl.sourceRefs[1].sourceUrl' assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json)"
          [[ "$(git hash-object "$windows_gplv3_source")" == "94a9ed024d3859793618152ea559a168bbcbb5e2" ]]
          [[ "$(sha256sum "$windows_gplv3_source" | cut -d' ' -f1)" == "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903" ]]
          cmp --silent assets/third_party/COPYING.GPLv3 "$windows_gplv3_source"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "version_code=$version_code"
            echo "candidate_sha=$tagged_sha"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    name: Signed Android APK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure external release signing
        shell: bash
        env:
          WYNIME_RELEASE_KEYSTORE_BASE64: ${{ secrets.WYNIME_RELEASE_KEYSTORE_BASE64 }}
          WYNIME_RELEASE_STORE_PASSWORD: ${{ secrets.WYNIME_RELEASE_STORE_PASSWORD }}
          WYNIME_RELEASE_KEY_ALIAS: ${{ secrets.WYNIME_RELEASE_KEY_ALIAS }}
          WYNIME_RELEASE_KEY_PASSWORD: ${{ secrets.WYNIME_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            WYNIME_RELEASE_KEYSTORE_BASE64 \
            WYNIME_RELEASE_STORE_PASSWORD \
            WYNIME_RELEASE_KEY_ALIAS \
            WYNIME_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              exit 1
            fi
          done

          keystore="$GITHUB_WORKSPACE/android/app/wynime-release.jks"
          printf '%s' "$WYNIME_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "WYNIME_RELEASE_STORE_FILE=$keystore"
            echo "WYNIME_RELEASE_STORE_PASSWORD=$WYNIME_RELEASE_STORE_PASSWORD"
            echo "WYNIME_RELEASE_KEY_ALIAS=$WYNIME_RELEASE_KEY_ALIAS"
            echo "WYNIME_RELEASE_KEY_PASSWORD=$WYNIME_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -s "$WYNIME_RELEASE_STORE_FILE"
          keytool -list -keystore "$WYNIME_RELEASE_STORE_FILE" -storepass "$WYNIME_RELEASE_STORE_PASSWORD" -alias "$WYNIME_RELEASE_KEY_ALIAS" >/dev/null

      - name: Build signed arm64-v8a Android APK
        run: >
          flutter build apk
          --release
          --no-pub
          --split-per-abi
          --target-platform android-arm64
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.version_code }}"
          --dart-define="WYNIME_BANGUMI_BROKER_ORIGIN=${WYNIME_BANGUMI_BROKER_ORIGIN}"

      - name: Verify Android metadata, alignment and signature
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test ! -e "build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt2="$build_tools/aapt2"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          for tool in "$aapt2" "$zipalign" "$apksigner"; do
            test -x "$tool" || { echo "Missing Android build tool: $tool" >&2; exit 1; }
          done

          package_line="$($aapt2 dump badging "$apk" | grep -m 1 '^package:')"
          # Flutter's split-per-ABI output offsets versionCode by ABI index * 1000.
          # arm64-v8a is ABI index 2, so build-number 4 is published as 2004.
          expected_split_version_code=$((2 * 1000 + EXPECTED_VERSION_CODE))
          grep -F "versionCode='$expected_split_version_code'" <<< "$package_line"
          grep -F "versionName='$EXPECTED_VERSION'" <<< "$package_line"
          grep -F "native-code: 'arm64-v8a'" <("$aapt2" dump badging "$apk")
          if "$aapt2" dump badging "$apk" | grep -E "armeabi-v7a|x86_64" >/dev/null; then
            echo 'The release APK contains an unexpected non-arm64 ABI.' >&2
            exit 1
          fi
          "$zipalign" -c -v 4 "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          unzip -l "$apk" | grep -F "assets/flutter_assets/LICENSE" >/dev/null
          unzip -l "$apk" | grep -F "assets/flutter_assets/assets/third_party/THIRD_PARTY_NOTICES.md" >/dev/null
          unzip -l "$apk" | grep -F "assets/flutter_assets/assets/third_party/COPYING.LGPLv3" >/dev/null
          unzip -l "$apk" | grep -F "assets/flutter_assets/assets/third_party/COPYING.GPLv3" >/dev/null
          unzip -l "$apk" | grep -F "assets/flutter_assets/assets/third_party/THIRD_PARTY_SOURCE_OFFER.md" >/dev/null
          unzip -l "$apk" | grep -F "assets/flutter_assets/assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json" >/dev/null

      - name: Verify APK signer against production association metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          python3 .github/scripts/verify_android_app_link.py \
            --apk "$apk" \
            --apksigner "$build_tools/apksigner" \
            --aapt2 "$build_tools/aapt2" \
            --config services/bangumi-broker/wrangler.toml

      - name: Name and hash Android artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="wynime-${{ needs.metadata.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$artifact"
          (cd dist && sha256sum "$artifact" > "$artifact.sha256")

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/wynime-release.jks

  windows:
    name: Windows x64 distribution
    needs: metadata
    runs-on: windows-2025
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install NuGet
        uses: NuGet/setup-nuget@v3

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release bundle
        run: >
          flutter build windows
          --release
          --no-pub
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.version_code }}"
          --dart-define="WYNIME_BANGUMI_BROKER_ORIGIN=$env:WYNIME_BANGUMI_BROKER_ORIGIN"

      - name: Verify Windows native provenance
        shell: pwsh
        run: >
          .github/scripts/verify_windows_native_provenance.ps1
          -DllPath build/windows/x64/runner/Release/libmpv-2.dll
          -LockPath assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json
          -LicensePath assets/third_party/COPYING.LGPLv3

      - name: Package and hash Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          $stage = Join-Path $env:RUNNER_TEMP "wynime-$version-windows-x64"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $zipName = "wynime-$version.zip"
          $zipPath = Join-Path $dist $zipName

          foreach ($required in @('wynime.exe', 'wynime_update.exe', 'flutter_windows.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $releaseDir $required) -PathType Leaf)) {
              throw "Windows ZIP runtime is missing: $required"
            }
          }

          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          Copy-Item -Path (Join-Path $releaseDir '*') -Destination $stage -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Destination (Join-Path $stage 'README.md') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination (Join-Path $stage 'LICENSE') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'assets/third_party/THIRD_PARTY_NOTICES.md') -Destination (Join-Path $stage 'THIRD_PARTY_NOTICES.md') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'assets/third_party/COPYING.GPLv3') -Destination (Join-Path $stage 'COPYING.GPLv3') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'assets/third_party/COPYING.LGPLv3') -Destination (Join-Path $stage 'COPYING.LGPLv3') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'assets/third_party/THIRD_PARTY_SOURCE_OFFER.md') -Destination (Join-Path $stage 'THIRD_PARTY_SOURCE_OFFER.md') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json') -Destination (Join-Path $stage 'WINDOWS_LIBMPV_BUILD.lock.json') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "docs/release-notes-$version.md") -Destination (Join-Path $stage 'RELEASE_NOTES.md') -Force
          Set-Content -LiteralPath (Join-Path $stage 'version.txt') -Value $version -NoNewline -Encoding ascii

          if ((Get-Content -Raw -LiteralPath (Join-Path $stage 'version.txt')) -ne $version) {
            throw 'version.txt does not match the release version.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'THIRD_PARTY_NOTICES.md') -PathType Leaf)) {
            throw 'THIRD_PARTY_NOTICES.md is missing from the Windows bundle.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'LICENSE') -PathType Leaf)) {
            throw 'LICENSE is missing from the Windows bundle.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'COPYING.LGPLv3') -PathType Leaf)) {
            throw 'COPYING.LGPLv3 is missing from the Windows bundle.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'COPYING.GPLv3') -PathType Leaf)) {
            throw 'COPYING.GPLv3 is missing from the Windows bundle.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'THIRD_PARTY_SOURCE_OFFER.md') -PathType Leaf)) {
            throw 'THIRD_PARTY_SOURCE_OFFER.md is missing from the Windows bundle.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'WINDOWS_LIBMPV_BUILD.lock.json') -PathType Leaf)) {
            throw 'WINDOWS_LIBMPV_BUILD.lock.json is missing from the Windows bundle.'
          }
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" -Value "$hash  $zipName" -NoNewline -Encoding ascii
          Remove-Item -LiteralPath $stage -Recurse -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  android-app-link-association:
    name: Verify production Android App Link association
    needs:
      - metadata
      - android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Verify Android artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          artifact="wynime-${{ needs.metadata.outputs.version }}-arm64-v8a.apk"
          test -f "dist/$artifact"
          test -f "dist/$artifact.sha256"
          (cd dist && sha256sum --check --strict "$artifact.sha256")

      - name: Verify live production association without redirects
        shell: bash
        env:
          EXPECTED_ORIGIN: https://wynime-bangumi-broker.wzhou785.workers.dev
        run: |
          set -euo pipefail
          origin="${WYNIME_BANGUMI_BROKER_ORIGIN%/}"
          if [[ -z "$origin" || "$origin" != "$EXPECTED_ORIGIN" ]]; then
            echo 'WYNIME_BANGUMI_BROKER_ORIGIN is missing or is not the production broker origin.' >&2
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for tool in "$build_tools/apksigner" "$build_tools/aapt2"; do
            test -x "$tool" || { echo "Missing Android build tool: $tool" >&2; exit 1; }
          done

          dal_body="$RUNNER_TEMP/assetlinks.json"
          dal_headers="$RUNNER_TEMP/assetlinks.headers"
          dal_status="$(curl --fail --silent --show-error --max-redirs 0 \
            --dump-header "$dal_headers" \
            --output "$dal_body" \
            --write-out '%{http_code}' \
            "$origin/.well-known/assetlinks.json")"
          if [[ "$dal_status" != '200' ]]; then
            echo "Production assetlinks.json returned HTTP $dal_status, expected direct HTTP 200." >&2
            exit 1
          fi
          grep -Eiq '^content-type:[[:space:]]*application/json([;[:space:]]|$)' "$dal_headers"
          grep -Eiq '^cache-control:[[:space:]]*no-store([;[:space:]]|$)' "$dal_headers"

          python3 .github/scripts/verify_android_app_link.py \
            --apk "dist/wynime-${{ needs.metadata.outputs.version }}-arm64-v8a.apk" \
            --apksigner "$build_tools/apksigner" \
            --aapt2 "$build_tools/aapt2" \
            --config services/bangumi-broker/wrangler.toml \
            --assetlinks "$dal_body"

  github-release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - windows
      - android-app-link-association
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}

      - name: Revalidate immutable publication SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.metadata.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Publication checkout $actual_sha does not equal approved candidate $EXPECTED_SHA." >&2
            exit 1
          fi

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Verify exact release asset set and checksums
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          expected=(
            "wynime-$version-arm64-v8a.apk"
            "wynime-$version-arm64-v8a.apk.sha256"
            "wynime-$version.zip"
            "wynime-$version.zip.sha256"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual_sorted < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${actual_sorted[*]}" != "${expected_sorted[*]}" ]]; then
            echo 'Release assets do not match the required naming contract.' >&2
            printf 'Expected: %s\n' "${expected_sorted[*]}" >&2
            printf 'Actual: %s\n' "${actual_sorted[*]}" >&2
            exit 1
          fi
          (cd dist && sha256sum --check --strict "wynime-$version-arm64-v8a.apk.sha256")
          (cd dist && sha256sum --check --strict "wynime-$version.zip.sha256")

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.metadata.outputs.tag }}'
          version='${{ needs.metadata.outputs.version }}'
          notes="docs/release-notes-$version.md"
          assets=(
            "dist/wynime-$version-arm64-v8a.apk"
            "dist/wynime-$version-arm64-v8a.apk.sha256"
            "dist/wynime-$version.zip"
            "dist/wynime-$version.zip.sha256"
          )
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to mutate an existing release." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GH_REPO" "${assets[@]}" --title "Wynime $version" --notes-file "$notes"
