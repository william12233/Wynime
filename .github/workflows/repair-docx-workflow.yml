name: Repair DOCX workflow branch tracking

on:
  push:
    branches:
      - phase-1/persistence
    paths:
      - .repair-docx-workflow-request

permissions:
  contents: write

concurrency:
  group: wynime-repair-docx-workflow
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: phase-1/persistence
          fetch-depth: 0
      - name: Repair long-lived branch references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-detailed-plan-docx.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'branches:\n      - bootstrap/phase-0': 'branches:\n      - main',
              '        with:\n          ref: bootstrap/phase-0\n          fetch-depth: 0': '        with:\n          fetch-depth: 0',
              'git push origin HEAD:bootstrap/phase-0': 'git push origin "HEAD:${GITHUB_REF_NAME}"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repaired workflow
        shell: bash
        run: |
          rm -f .repair-docx-workflow-request
          rm -f .github/workflows/repair-docx-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: track DOCX snapshots from main"
          git pull --rebase origin phase-1/persistence
          git push origin HEAD:phase-1/persistence
