 
                                                   
 
                                                                                                                                                                                                                    
                                                                                                          
 
                                                   
 
kotlin.code.style=official
android.useAndroidX=true
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStorePassword=changeit -Dkotlin.daemon.jvm.options\="-Xmx4096M"
                                                                                       
version.name=2.0.2
                                                        
package.version=2.0.2
org.gradle.caching=true
org.gradle.configuration-cache=true

# Gradle runs in the JVM and does not reliably consume shell *_PROXY variables.
# Keep repository/plugin resolution on the managed environment proxy.
                                                                      
                                                                                       
                                                                                                                              
                                                                                  
                                                                          
                                                                                             
                                                                  
                                         
android.compile.sdk=37
android.min.sdk=27
                            
jvm.toolchain.version=21
