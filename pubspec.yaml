name: wynime
description: "Wynime cross-platform animation source player."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  crypto: 3.0.7
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_inappwebview: 6.2.0-beta.3
  html: 0.15.6
  pub_semver: 2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  media_kit_libs_windows_video: 1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: 2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/third_party/THIRD_PARTY_NOTICES.md
