name: wynime
description: "Wynime cross-platform animation source player."
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  crypto: 3.0.7
  archive: 4.0.9
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_inappwebview: 6.2.0-beta.3
  html: 0.15.6
  http: ^1.6.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pub_semver: 2.2.0
  url_launcher: ^6.3.2
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  media_kit_libs_windows_video:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: e9abf3b9114fdb565b13a4c194d776c70e416e7d
      path: libs/windows/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: 2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/third_party/THIRD_PARTY_NOTICES.md
    - assets/third_party/COPYING.GPLv3
    - assets/third_party/COPYING.LGPLv3
    - assets/third_party/THIRD_PARTY_SOURCE_OFFER.md
    - assets/third_party/WINDOWS_LIBMPV_BUILD.lock.json
